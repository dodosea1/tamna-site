<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{verify_meta}}
{{published_meta}}
<meta property="og:type" content="{{og_type}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="{{base}}/static/favicon.png">
<link rel="stylesheet" href="{{base}}/static/style.css">
<link rel="alternate" type="application/rss+xml" title="{{site_title}} 작업 기록" href="{{base}}/feed.xml">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{base}}/">{{brand}}</a>
    <nav class="site-nav" id="site-nav">
      {{nav}}
    </nav>
    {{header_follow}}
    <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-nav">메뉴</button>
  </div>
</header>
<main>
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p class="footer-nav">{{footer_nav}}</p>
    <p>{{site_title}} · {{year}} · {{footer_links}}<a href="{{base}}/feed.xml">RSS</a></p>
    <p class="attribution">사이트의 그림과 화면은 개발 중인 게임의 것이며 바뀔 수 있습니다.</p>
  </div>
</footer>
<script>
document.querySelectorAll('.email').forEach(function (e) { e.textContent = e.dataset.u + '@' + e.dataset.d; });
document.querySelectorAll('.copy').forEach(function (b) {
  b.addEventListener('click', function () {
    var label = b.textContent;
    navigator.clipboard.writeText(b.dataset.copy).then(function () {
      b.textContent = '복사했습니다';
      setTimeout(function () { b.textContent = label; }, 2000);
    });
  });
});
var toggle = document.querySelector('.menu-toggle');
var nav = document.getElementById('site-nav');
if (toggle && nav) {
  toggle.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.textContent = open ? '닫기' : '메뉴';
  });
}
document.querySelectorAll('.play-video').forEach(function (v) {
  function toggle() { if (v.paused) { v.play(); } else { v.pause(); } }
  v.addEventListener('click', toggle);
  v.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
});
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.querySelectorAll('video[autoplay]').forEach(function (v) { v.removeAttribute('autoplay'); v.pause(); v.controls = true; });
}
var header = document.querySelector('.site-header');
function onScroll() { header.classList.toggle('scrolled', window.scrollY > 40); }
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();
</script>
</body>
</html>
