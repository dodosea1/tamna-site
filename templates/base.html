<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{verify_meta}}
{{published_meta}}
<meta property="og:type" content="{{og_type}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{base}}/static/brand/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="{{base}}/static/brand/favicon.svg">
<link rel="apple-touch-icon" href="{{base}}/static/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{base}}/static/style.css">
<link rel="alternate" type="application/rss+xml" title="{{site_title}} 개발 기록" href="{{base}}/feed.xml">
</head>
<body>
<script>document.documentElement.classList.add('js')</script>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{base}}/">{{brand}}</a>
    <nav class="site-nav" id="site-nav">
      {{nav}}
    </nav>
    {{header_follow}}
    <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-nav">메뉴</button>
  </div>
</header>
<main>
{{band}}{{content}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p class="footer-nav">{{footer_nav}}</p>
    <p>{{site_title}} · {{year}} · {{footer_links}}<a href="{{base}}/feed.xml">RSS</a></p>
    <p class="attribution">사이트의 그림과 화면은 개발 중인 게임의 것이며 바뀔 수 있습니다.</p>
  </div>
</footer>
<script src="{{base}}/static/site.js" defer></script>
{{analytics}}
</body>
</html>
