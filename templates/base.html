<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site_title}}</title>
<link rel="stylesheet" href="{{base}}/static/style.css">
<link rel="alternate" type="application/rss+xml" title="{{site_title}} 작업 기록" href="{{base}}/feed.xml">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{base}}/">탐라</a>
    <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-nav">메뉴</button>
    <nav class="site-nav" id="site-nav">
      <a href="{{base}}/log/">작업 기록</a>
      <a href="{{base}}/monthly/">이달의 정리</a>
      {{nav}}
    </nav>
  </div>
</header>
<main>
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>{{site_title}} · {{year}} · {{footer_links}}<a href="{{base}}/feed.xml">RSS</a></p>
    <p class="attribution">사이트의 그림과 화면은 개발 중인 게임의 것이며 바뀔 수 있습니다.</p>
  </div>
</footer>
<script>
document.querySelectorAll('.email').forEach(function (e) { e.textContent = e.dataset.u + '@' + e.dataset.d; });
var toggle = document.querySelector('.menu-toggle');
var nav = document.getElementById('site-nav');
if (toggle && nav) {
  toggle.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.textContent = open ? '닫기' : '메뉴';
  });
}
var header = document.querySelector('.site-header');
function onScroll() { header.classList.toggle('scrolled', window.scrollY > 40); }
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();
</script>
</body>
</html>
